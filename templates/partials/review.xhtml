        <div class="review">
          <div class="review__head">
            <span class="review__avatar review__avatar--initial">{{initial}}</span>
            <div class="review__who">
              <p class="review__name">{{name}}</p>
              <p class="review__meta"><img src="{{asset.star}}" alt="" width="5" height="5" /> {{product}} &#8226; <span class="review__date">{{date}}</span></p>
            </div>
          </div>
          <div class="rating" style="--rating: {{rating}}" title="{{rating}} dari 5"></div>
          <p class="review__text">{{comment}}</p>
        </div>
