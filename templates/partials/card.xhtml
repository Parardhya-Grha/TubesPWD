        <div class="card">
          <div class="card__media">
            <div class="card__photo">
{{#if badge}}
              <span class="card__badge {{badge_class}}">{{badge}}</span>
{{/if}}
              <img src="{{image}}" alt="{{name}}" />
            </div>
          </div>
          <div class="card__info">
            <p class="card__brand">{{brand_line}}</p>
            <h3 class="card__name" title="{{name}}">{{name}}</h3>
{{#if show_detail}}
            <p class="card__detail">{{detail}}</p>
{{/if}}
            <p class="card__price"><span class="card__amount">{{price}}</span> <span class="card__unit">/hari</span></p>
            <form class="add-to-cart" action="add_to_cart.php" method="post">
              <div>
                <input type="hidden" name="id_product" value="{{id_product}}" />
                <input type="hidden" name="csrf" value="{{csrf}}" />
                <input type="hidden" name="return" value="{{return_to}}" />
{{#if in_stock}}
                <button type="submit" class="card__btn"><img src="{{asset.cart_small}}" alt="" width="8" height="8" /> Add to Cart</button>
{{else}}
                <button type="button" class="card__btn card__btn--disabled" disabled="disabled">Out of Stock</button>
{{/if}}
              </div>
            </form>
          </div>
        </div>
