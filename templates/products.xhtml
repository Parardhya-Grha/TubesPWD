<?php
// products.xhtml - the ALL PRODUCTS page. product.php prepares these variables:
//   $f (filters), $total, $page, $total_pages, $products, $from, $to,
//   $categories, $brands, $sizes
// (Pictures of the lists below: category/price/brand/size/availability/sort dropdowns.)
?>
  <div class="container">

    <!-- PAGE HEADER -->
    <div class="page-header">
      <p class="breadcrumb"><a href="index.php">Home</a><span>/</span>Product</p>
      <h1 class="page-title">ALL PRODUCTS</h1>
      <p class="page-count">Showing <?= $total ?> product<?php if ($total != 1) { echo 's'; } ?><?php if ($f['q'] != '') { echo ' for &#8220;' . e($f['q']) . '&#8221;'; } ?></p>
    </div>

    <!-- QUICK CATEGORIES (click one to filter, click again to clear) -->
    <div class="quick-cats">
<?php foreach ($categories as $c) {
    $is_active = ($f['cat'] == $c['slug_kategori']);
    $new_cat = $c['slug_kategori'];
    if ($is_active) { $new_cat = ''; }
?>
      <a class="quick-cat<?php if ($is_active) { echo ' is-active'; } ?>" href="<?= e(listing_url($f, ['cat' => $new_cat])) ?>">
        <img src="<?= e(img_path($c['icon_url'])) ?>" alt="" />
        <span><?= e($c['nama_kategori']) ?></span>
      </a>
<?php } ?>
    </div>

    <!-- FILTER BAR -->
    <form id="filter-form" class="filterbar" action="product.php" method="get">
      <div class="filterbar__row">
<?php if ($f['q'] != '') { ?>
        <input type="hidden" name="q" value="<?= e($f['q']) ?>" />
<?php } ?>
        <button type="submit" class="filter-btn"><img src="<?= ASSET['sliders'] ?>" alt="" width="20" height="20" /> Filter</button>
<?php
print_select('cat',   'Category',      $category_options, $f['cat'],   true);
print_select('price', 'Price',         $price_options,    $f['price'], true);
print_select('brand', 'Brand',         $brand_options,    $f['brand'], true);
print_select('size',  'Size/Capacity', $size_options,     $f['size'],  true);
print_select('avail', 'Availability',  $AVAILABILITY,     $f['avail'], true);
?>
<?php if (has_filters($f)) { ?>
        <a class="filter-clear" href="product.php">Clear all</a>
<?php } ?>
        <div class="filterbar__sort">
          <span class="filterbar__sort-label">Sort by:</span>
<?php print_select('sort', 'Newest', $sort_options, $f['sort'], false); ?>
        </div>
      </div>
    </form>

    <!-- PRODUCT GRID -->
<?php if (count($products) > 0) { ?>
    <div class="product-grid">
<?php foreach ($products as $p) { print_card($p, true); } ?>
    </div>
<?php } else { ?>
    <div class="empty">
      <p class="empty__title">No products match your filters.</p>
      <p><a href="product.php">Show all products</a></p>
    </div>
<?php } ?>

    <!-- PAGINATION: previous arrow, up to 5 page numbers, next arrow -->
<?php
$first_number = max(1, $page - 2);                       // show 2 pages before the current one
$last_number = min($total_pages, $first_number + 4);     // ...up to 5 numbers in total
$first_number = max(1, $last_number - 4);
?>
    <div class="pagination">
      <p class="pagination__count">Showing <?= $from ?>&#8211;<?= $to ?> of <?= $total ?> products</p>
      <div class="pagination__pages">
<?php if ($page > 1) { ?>
        <a class="page-link" href="<?= e(listing_url($f, ['page' => $page - 1])) ?>" title="Previous">&#8249;</a>
<?php } else { ?>
        <span class="page-link is-disabled">&#8249;</span>
<?php } ?>
<?php for ($i = $first_number; $i <= $last_number; $i++) { ?>
<?php if ($i == $page) { ?>
        <span class="page-link is-current"><?= $i ?></span>
<?php } else { ?>
        <a class="page-link" href="<?= e(listing_url($f, ['page' => $i])) ?>"><?= $i ?></a>
<?php } ?>
<?php } ?>
<?php if ($page < $total_pages) { ?>
        <a class="page-link" href="<?= e(listing_url($f, ['page' => $page + 1])) ?>" title="Next">&#8250;</a>
<?php } else { ?>
        <span class="page-link is-disabled">&#8250;</span>
<?php } ?>
      </div>
    </div>

  </div>
