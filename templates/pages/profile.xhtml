<div class="ph-page">
    <div class="ph-heading">
        <h1>Profil Saya</h1>
        <p>Kelola informasi akun CampRent Anda.</p>
    </div>

    {{#if error}}
    <div class="ph-message ph-error">{{error}}</div>
    {{/if}}

    {{#if success}}
    <div class="ph-message ph-success">{{success}}</div>
    {{/if}}

    <div class="ph-profile-card">

        <div class="ph-avatar">{{nama_lengkap}}</div>

        <form action="profile.php" method="post">

            <input type="hidden" name="csrf" value="{{csrf}}" />

            <div class="ph-field">
                <label for="nama">Nama Lengkap</label>
                <input type="text"
                       id="nama"
                       name="nama_lengkap"
                       value="{{nama_lengkap}}"
                       required="required" />
            </div>

            <div class="ph-field">
                <label for="email">Email</label>
                <input type="email"
                       id="email"
                       value="{{email}}"
                       readonly="readonly" />
                <small>Email tidak dapat diubah.</small>
            </div>

            <div class="ph-field">
                <label for="hp">Nomor HP</label>
                <input type="text"
                       id="hp"
                       name="no_hp"
                       value="{{no_hp}}"
                       required="required" />
            </div>

            <div class="ph-field">
                <label for="alamat">Alamat</label>
                <textarea id="alamat"
                          name="alamat_default"
                          rows="4">{{alamat_default}}</textarea>
            </div>

            <div class="ph-field">
                <label>Tanggal Bergabung</label>
                <input type="text"
                       value="{{created_at}}"
                       readonly="readonly" />
            </div>

            <button type="submit" class="ph-button">
                Simpan Perubahan
            </button>

        </form>

        <a class="ph-history-link" href="history.php">
            Lihat Riwayat Penyewaan
        </a>

    </div>
</div>
