  <div class="container">

    <!-- HERO -->
    <div class="hero">
      <img class="hero__img" src="{{asset.hero}}" alt="" />
      <img class="hero__dots" src="{{asset.hero_dots}}" alt="" width="63" height="8" />
    </div>

    <!-- CATEGORIES -->
    <div class="categories">
{{#each categories}}
      <a class="category" href="{{url}}"><img src="{{icon}}" alt="" /><span>{{name}}</span></a>
{{/each}}
    </div>

    <!-- PRODUK POPULER / TERBARU -->
{{#with popular}}
{{> carousel}}
{{/with}}
{{#with newest}}
{{> carousel}}
{{/with}}

    <!-- REVIEW -->
    <div class="reviews">
      <h2 class="section-title">REVIEW</h2>
      <div class="reviews__track">
{{#each reviews}}
{{> review}}
{{/each}}
      </div>
    </div>

  </div>
